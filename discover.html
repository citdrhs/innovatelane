<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnovateLane</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./media/img/logo.jpg">
</head>

<body>
    <header>
        <nav id="navigation" class="navigation">
            <div class="navigation__link" href="./index.html">
                <img class="logo"
                    src="./media/img/logo.jpg" alt="Logo">
            </div>
            <div class="menu-dropdown" id="menu-dropdown">
                <img width="20px" height="20px" src="./media/img/dropdown.png"
                    alt=">">
            </div>
            <div class="navigation__list" id="navigation__list">
                <div class="navigation__item">
                    <a class="navigation__link" href="./discover.html">Discover</a>
                </div>
                <div class="navigation__item">
                    <a class="navigation__link" href="#">Tab2</a>
                </div>
                <div class="navigation__item">
                    <a class="navigation__link" href="#">Tab3</a>
                </div>
            </div>
            <div class="navigation__list navigation__user">
                <div class="navigation__item">
                    <a class="navigation__link" href="#">Log In</a>
                </div>
            </div>
        </nav>
    </header>
    <h1>Check Out Project In Your Community</h1>
    <!--Grid of posts-->
    <div id="post-grid" class="post-grid"></div>

    <!-- Floating + button -->
    <button id="add-post-btn" class="floating-btn">+</button>

    <!-- Popup Form -->
    <div id="popup" class="popup hidden">
        <div class="popup-content">
            <h2>Create a Post</h2>
            <form id="post-form">
                <input type="text" id="title" placeholder="Project title" required>
                <textarea id="description" placeholder="Describe your idea..." required></textarea>
                <input type="url" id="link" placeholder="Project link (optional)">
                <button type="submit">Post</button>
                <button type="button" id="close-popup" class="close-btn">Cancel</button>
            </form>
        </div>
    </div>
    <script src="./js/script.js"></script>
</body>

</html>
